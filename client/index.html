<!DOCTYPE html>
<html lang="ka">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />

  <!-- Apply a saved dark theme before first paint (ThemeSwitch keeps it in sync after) -->
  <script>try { if (localStorage.getItem("theme-mode") === "dark") document.documentElement.classList.add("dark"); } catch (e) {}</script>

  <!-- PWA / Theme -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#F5F1EB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MR Studio" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-startup-image" href="/app-icon.png" />

  <!-- SEO Meta Tags -->
  <title>THE MR Studio · ფრჩხილები, ლაზერი, ესთეტიკა · Nails, laser &amp; aesthetics in Tbilisi</title>
  <meta name="description"
    content="ფრჩხილები, ლაზერული ეპილაცია და ესთეტიკა დიდ დიღომში, თბილისი. Nails, laser hair removal and aesthetics in Didi Dighomi, Tbilisi." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://themrstudio.net/" />

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://themrstudio.net/" />
  <meta property="og:title" content="THE MR Studio · ფრჩხილები, ლაზერი, ესთეტიკა" />
  <meta property="og:description"
    content="დიდი დიღომი, თბილისი. Nails, laser and aesthetics in Didi Dighomi, Tbilisi." />
  <meta property="og:site_name" content="THE MR Studio" />
  <meta property="og:image" content="https://themrstudio.net/og-image.png" />
  <meta property="og:image:alt" content="THE MR Studio · ფრჩხილები, ლაზერი, ესთეტიკა" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ka_GE" />
  <meta property="og:locale:alternate" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="THE MR Studio · ფრჩხილები, ლაზერი, ესთეტიკა" />
  <meta name="twitter:description"
    content="ფრჩხილები, ლაზერი და ესთეტიკა თბილისში. Nails, laser and aesthetics in Tbilisi." />
  <meta name="twitter:image" content="https://themrstudio.net/og-image.png" />

  <!-- LCP: the default hero art (admin-uploaded hero images replace it) -->
  <link rel="preload" as="image" href="/images/hero-1024.webp" type="image/webp"
    imagesrcset="/images/hero-512.webp 512w, /images/hero-768.webp 768w, /images/hero-1024.webp 1024w"
    imagesizes="(min-width: 1024px) 42vw, 100vw" fetchpriority="high" />

  <!-- Self-hosted fonts: preload only the two first-paint files (Georgian text + the hero wordmark) -->
  <link rel="preload" href="/fonts/noto-sans-georgian-georgian.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Favicon — MR monogram, matches the wordmark -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/app-icon-512.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
